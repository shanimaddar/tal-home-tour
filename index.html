<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============================================================
   כל המידות בס"מ, לפי התוכנית. x = מערב→מזרח, y = צפון→דרום.
   בתלת-ממד: X = x/100, Z = y/100, Y = גובה. צפון = Z שלילי.
   ============================================================ */
/* ===== פרטי הפרויקט – עורכים כאן ===== */
const PROJECT = { title: 'הדמיה לטל', subtitle: 'בית פרטי · מפלס מגורים ואגף חדרים' };
/* ====================================== */
const H = 270;            // גובה תקרה
const LOWER = -153;       // מפלס הקומה התחתונה (יציאה אחורית)
const GROUND_S = -45;     // קרקע בצד הדרומי
const GROUND_N = -153;    // קרקע בצד הצפוני (שיפוע)
const WING = 144;         // מפלס אגף החדרים: 8 מדרגות × 18 ס"מ מעל הסלון
// אגף החדרים (הורים, ילדים, מסדרון, רחצה) – מפלס עליון
const inWing = (x, y) => (x <= 826 && y <= 706) || (x <= 376 && y <= 963);
const LV = (x, y) => inWing(x, y) ? WING : 0;
let AUTO = true;
// גובה עליון של קיר/תקרה: הסלון, המטבח ופינת האוכל בגובה כפול, כדי שמהמדרגות רואים את כל הבית
const isShort = (x, y) => (x >= 1028 && y >= 1268) || (x >= 790 && x <= 1028 && y >= 1250);
const topAt = (x, y) => inWing(x, y) ? H + WING : isShort(x, y) ? H : H + WING;          // הרמה אוטומטית של אלמנטים שנמצאים באגף

/* ---------------- renderer / scene ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, matchMedia('(pointer: coarse)').matches ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfd6e6);
scene.fog = new THREE.Fog(0xbfd6e6, 40, 90);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(82, innerWidth / innerHeight, 0.05, 200);

/* ---------------- canvas textures ---------------- */
function canvasTex(w, h, draw, repeat = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 8;
  return t;
}
const rnd = (a, b) => a + Math.random() * (b - a);
function noise(g, w, h, amt, n = 4000) {
  for (let i = 0; i < n; i++) { g.fillStyle = `rgba(${Math.random() < .5 ? '0,0,0' : '255,255,255'},${rnd(0, amt)})`; g.fillRect(rnd(0, w), rnd(0, h), rnd(1, 3), rnd(1, 3)); }
}
// פרקט אלון (1 טקסטורה = 1.2 מ')
const texWood = canvasTex(1024, 1024, (g, w, h) => {
  const rows = 8, rh = h / rows;
  for (let r = 0; r < rows; r++) {
    let x = -rnd(0, 400);
    while (x < w) {
      const L = rnd(300, 600), base = rnd(0, 1);
      const col = `hsl(${30 + base * 6},${38 + base * 12}%,${58 + base * 10}%)`;
      g.fillStyle = col; g.fillRect(x, r * rh, L, rh);
      for (let k = 0; k < 14; k++) { // עורקי עץ
        g.strokeStyle = `rgba(90,55,25,${rnd(.04, .14)})`; g.lineWidth = rnd(.5, 2);
        const yy = r * rh + rnd(4, rh - 4);
        g.beginPath(); g.moveTo(x, yy);
        for (let s = 0; s <= 6; s++) g.lineTo(x + L * s / 6, yy + Math.sin(s * rnd(.5, 1.5)) * rnd(1, 5));
        g.stroke();
      }
      g.fillStyle = 'rgba(60,35,15,.35)'; g.fillRect(x, r * rh, 2, rh);
      x += L;
    }
    g.fillStyle = 'rgba(60,35,15,.35)'; g.fillRect(0, r * rh, w, 2);
  }
  noise(g, w, h, .05);
});
// פורצלן 60×60 (1 טקסטורה = 1.2 מ')
const texTile = canvasTex(1024, 1024, (g, w, h) => {
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
    const l = rnd(86, 90); g.fillStyle = `hsl(35,8%,${l}%)`; g.fillRect(i * 512, j * 512, 512, 512);
    for (let k = 0; k < 25; k++) { g.strokeStyle = `rgba(150,140,130,${rnd(.03, .08)})`; g.lineWidth = rnd(2, 10); g.beginPath(); g.moveTo(i * 512 + rnd(0, 512), j * 512); g.bezierCurveTo(i * 512 + rnd(0, 512), j * 512 + 200, i * 512 + rnd(0, 512), j * 512 + 300, i * 512 + rnd(0, 512), j * 512 + 512); g.stroke(); }
  }
  noise(g, w, h, .03);
  g.fillStyle = 'rgba(120,115,108,.55)';
  for (let i = 0; i <= 2; i++) { g.fillRect(i * 512 - 2, 0, 4, h); g.fillRect(0, i * 512 - 2, w, 4); }
});
// אריחי אמבטיה 30×60 (1 טקסטורה = 1.2 מ')
const texBath = canvasTex(1024, 1024, (g, w, h) => {
  for (let j = 0; j < 4; j++) for (let i = 0; i < 2; i++) {
    g.fillStyle = `hsl(200,4%,${rnd(66, 71)}%)`; g.fillRect(i * 512, j * 256, 512, 256);
  }
  noise(g, w, h, .06, 8000);
  g.fillStyle = 'rgba(60,60,60,.5)';
  for (let i = 0; i <= 2; i++) g.fillRect(i * 512 - 2, 0, 4, h);
  for (let j = 0; j <= 4; j++) g.fillRect(0, j * 256 - 2, w, 4);
});
// דק עץ (1 טקסטורה = 1.2 מ')
const texDeck = canvasTex(1024, 1024, (g, w, h) => {
  const n = 8, bw = w / n;
  for (let i = 0; i < n; i++) {
    g.fillStyle = `hsl(25,${rnd(30, 40)}%,${rnd(38, 46)}%)`; g.fillRect(i * bw, 0, bw - 8, h);
    for (let k = 0; k < 10; k++) { g.fillStyle = `rgba(40,20,10,${rnd(.05, .15)})`; g.fillRect(i * bw + rnd(4, bw - 14), 0, rnd(1, 3), h); }
  }
  noise(g, w, h, .06);
});
// אבן לכניסה
const texStone = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#b9b2a6'; g.fillRect(0, 0, w, h); noise(g, w, h, .12, 12000);
  g.fillStyle = 'rgba(80,75,70,.5)'; g.fillRect(0, 254, w, 4); g.fillRect(254, 0, 4, h);
});
const texGrass = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#7d9a5a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) { g.fillStyle = `hsl(${rnd(75, 100)},${rnd(25, 45)}%,${rnd(30, 50)}%)`; g.fillRect(rnd(0, w), rnd(0, h), 1.5, rnd(2, 6)); }
});
// בד
const texFabric = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 2) { g.fillStyle = `rgba(0,0,0,${rnd(.02, .07)})`; g.fillRect(0, y, w, 1); }
  for (let x = 0; x < w; x += 2) { g.fillStyle = `rgba(0,0,0,${rnd(.02, .06)})`; g.fillRect(x, 0, 1, h); }
});
texFabric.repeat.set(3, 3);
const texMarble = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#fbfaf8'; g.fillRect(0, 0, w, h);
  for (let k = 0; k < 18; k++) { g.strokeStyle = `rgba(120,115,110,${rnd(.06, .28)})`; g.lineWidth = rnd(.6, 3.5); g.beginPath(); let x = rnd(0, w), y = 0; g.moveTo(x, y); while (y < h) { x += rnd(-40, 40); y += rnd(20, 60); g.lineTo(x, y); } g.stroke(); }
  noise(g, w, h, .03);
});

/* ---------------- materials ---------------- */
const std = (color, rough = .8, metal = 0, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal, ...extra });
const M = {
  wall: std(0xf3f0ea, .92),
  ceiling: std(0xfbfaf7, .95),
  wood: std(0xffffff, .55, 0, { map: texWood }),
  tile: std(0xffffff, .2, 0, { map: texTile }),
  bath: std(0xffffff, .3, 0, { map: texBath }),
  deck: std(0xffffff, .8, 0, { map: texDeck }),
  stone: std(0xffffff, .85, 0, { map: texStone }),
  grass: std(0xffffff, 1, 0, { map: texGrass }),
  plinth: std(0xa9a49b, .95),
  frame: std(0x2f3337, .45, .6),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xdfeff7, roughness: .05, metalness: 0, transparent: true, opacity: .18, envMapIntensity: 1.5, side: THREE.DoubleSide, depthWrite: false }),
  doorWood: std(0xd9cfc0, .6),
  frosted: new THREE.MeshPhysicalMaterial({ color: 0xf4f7f8, roughness: .7, metalness: 0, transparent: true, opacity: .82, side: THREE.DoubleSide }),
  frontDoor: std(0x4a3526, .5),
  oak: std(0xb88a5a, .6, 0, { map: texWood }),
  walnut: std(0x6b4a33, .5, 0, { map: texWood }),
  white: std(0xf7f7f5, .5),
  whiteGloss: std(0xffffff, .15),
  ceramic: std(0xffffff, .12, 0),
  chrome: std(0xdddddd, .15, 1),
  black: std(0x222222, .4, .2),
  matteBlack: std(0x1c1c1c, .7),
  counter: std(0xffffff, .16, 0, { map: texMarble }),
  artFrame: std(0x222222, .5),
  accent: std(0xc9b79c, .9, 0, { map: texFabric }),
  cabinet: std(0xe9e4dc, .45),
  sofa: std(0xb9b3aa, .95, 0, { map: texFabric }),
  sofa2: std(0x7d8a86, .95, 0, { map: texFabric }),
  linen: std(0xf2efe9, .95, 0, { map: texFabric }),
  throwBlanket: std(0xc9b79c, .95, 0, { map: texFabric }),
  pillow: std(0xffffff, .95, 0, { map: texFabric }),
  rug: std(0xd8d0c4, 1, 0, { map: texFabric }),
  rug2: std(0x9aa6a8, 1, 0, { map: texFabric }),
  leaf: std(0x4f7a45, .8),
  pot: std(0xc9b8a3, .8),
  screen: std(0x111418, .2, .3),
  steel: std(0xb8bcbf, .3, .8),
  lampShade: std(0xfff4e0, .9, 0, { emissive: 0x332a1a }),
};

/* ---------------- helpers ---------------- */
const house = new THREE.Group(); scene.add(house);
const ceilings = new THREE.Group(); scene.add(ceilings);
const roof = new THREE.Group(); scene.add(roof);
const labels = new THREE.Group(); scene.add(labels); labels.visible = false;
const colliders = []; // [x0,y0,x1,y1] בס"מ

function mesh(geo, mat, parent = house, cast = true, recv = true) {
  const m = new THREE.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = recv; parent.add(m); return m;
}
// קופסה לפי מלבן תוכנית (ס"מ) וגבהים (ס"מ)
function box(x0, y0, x1, y1, z0, z1, mat, parent = house, cast = true) {
  const off = AUTO ? LV((x0 + x1) / 2, (y0 + y1) / 2) : 0;
  const w = Math.abs(x1 - x0), d = Math.abs(y1 - y0), h = z1 - z0;
  const m = mesh(new THREE.BoxGeometry(w / 100, h / 100, d / 100), mat, parent, cast);
  m.position.set((x0 + x1) / 200, (z0 + z1) / 200 + off / 100, (y0 + y1) / 200);
  return m;
}
// רצפה עם UV בקנה מידה של העולם (tile = גודל טקסטורה במטרים)
function floorRect(x0, y0, x1, y1, mat, z = 0, tile = 1.2) {
  const w = (x1 - x0) / 100, d = (y1 - y0) / 100;
  const g = new THREE.PlaneGeometry(w, d);
  const uv = g.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, (uv.getX(i) * w + x0 / 100) / tile, (uv.getY(i) * d - y1 / 100) / tile);
  const m = mesh(g, mat, house, false, true);
  m.rotation.x = -Math.PI / 2;
  m.position.set((x0 + x1) / 200, (z + (AUTO ? LV((x0 + x1) / 2, (y0 + y1) / 2) : 0)) / 100, (y0 + y1) / 200);
  return m;
}
// קבוצת רהיט: קואורדינטות מקומיות בס"מ, מרכז ב-(cx,cy), סיבוב במעלות
function piece(cx, cy, rotDeg = 0, z = 0) {
  const g = new THREE.Group();
  g.position.set(cx / 100, (z + (AUTO ? LV(cx, cy) : 0)) / 100, cy / 100);
  g.rotation.y = -rotDeg * Math.PI / 180;
  g.scale.setScalar(0.01);
  house.add(g);
  const api = {
    g,
    b(w, h, d, x, y, zz, mat) { const m = mesh(new THREE.BoxGeometry(w, h, d), mat, g); m.position.set(x, y, zz); return m; }, // y = גובה מרכז
    cyl(rt, rb, h, x, y, zz, mat, seg = 24) { const m = mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat, g); m.position.set(x, y, zz); return m; },
    sph(r, x, y, zz, mat, sx = 1, sy = 1, sz = 1) { const m = mesh(new THREE.SphereGeometry(r, 20, 14), mat, g); m.position.set(x, y, zz); m.scale.set(sx, sy, sz); return m; },
    rbox(w, h, d, r, x, y, zz, mat) { const m = mesh(roundedBox(w, h, d, r), mat, g); m.position.set(x, y, zz); return m; },
  };
  return api;
}
function roundedBox(w, h, d, r) {
  const s = new THREE.Shape(); const x = -w / 2, y = -d / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + d - r); s.quadraticCurveTo(x + w, y + d, x + w - r, y + d);
  s.lineTo(x + r, y + d); s.quadraticCurveTo(x, y + d, x, y + d - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  const g = new THREE.ExtrudeGeometry(s, { depth: h, bevelEnabled: true, bevelThickness: Math.min(r, h / 2) * .6, bevelSize: Math.min(r, h / 2) * .6, bevelSegments: 3, curveSegments: 6 });
  g.rotateX(-Math.PI / 2); g.translate(0, -h / 2, 0); g.computeVertexNormals();
